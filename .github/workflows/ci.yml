name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint (Dockerfile)
        # Blocking at error severity (no-fail: false + failure-threshold: error).
        # The Dockerfile passes at that threshold today; lower-severity findings
        # (e.g. the templated `FROM ${BUILD_FROM}` base, which hadolint reads as
        # untagged) stay visible in the CI log but do not block PRs. Errors do.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claudecode/Dockerfile
          # DL3008/DL3013/DL3018: pinning every apt/pip/apk package version is
          # impractical for an HA app image; cadence is owned by the base image.
          # DL4006: the CMD is a single `&&` chain, no pipes, so set -o pipefail
          # would not buy us anything.
          ignore: DL3008,DL3013,DL3018,DL4006
          failure-threshold: error
          no-fail: false

      - name: Validate YAML config files parse
        run: |
          python3 - <<'PY'
          import yaml
          for p in ("claudecode/config.yaml", "claudecode/build.yaml", "repository.yaml"):
              with open(p) as f:
                  yaml.safe_load(f)
              print(f"ok: {p}")
          PY

      - name: Version matches CHANGELOG entry
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('claudecode/config.yaml'))['version'])")
          echo "config.yaml version: $VERSION"
          if ! grep -qE "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" claudecode/CHANGELOG.md; then
              echo "::error file=claudecode/CHANGELOG.md::Missing entry '## [$VERSION] - YYYY-MM-DD' for current version"
              exit 1
          fi

      - name: every option has a translation in every language
        # An option with no translation shows up in the Home Assistant UI as a
        # bare key with no name or description (claude_update_timeout shipped
        # that way until 1.2.82).
        run: |
          python3 - <<'PY'
          import sys, yaml
          opts = set(yaml.safe_load(open("claudecode/config.yaml"))["options"])
          bad = False
          for lang in ("en", "es", "pt-BR"):
              path = f"claudecode/translations/{lang}.yaml"
              keys = set((yaml.safe_load(open(path, encoding="utf-8")) or {}).get("configuration", {}))
              missing, extra = sorted(opts - keys), sorted(keys - opts)
              if missing:
                  print(f"::error file={path}::options with no translation: {missing}")
                  bad = True
              if extra:
                  print(f"::error file={path}::translations for options that no longer exist: {extra}")
                  bad = True
          if bad:
              sys.exit(1)
          print(f"ok: {len(opts)} options translated in en, es, pt-BR")
          PY

      - name: every option is actually read by the boot script
        # working_directory was accepted, documented and translated for many
        # releases while nothing read it (fixed in 1.2.82). A configurable option
        # that no code consults is worse than no option at all.
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          opts = yaml.safe_load(open("claudecode/config.yaml"))["options"]
          # The boot script lives in the Dockerfile CMD; the guard options are
          # consumed by the rootfs helper scripts it calls.
          sources = ["claudecode/Dockerfile"] + sorted(glob.glob("claudecode/rootfs/usr/local/bin/*.sh"))
          blob = "".join(open(p, encoding="utf-8").read() for p in sources)
          unread = [o for o in opts if f".{o}" not in blob]
          if unread:
              print(f"::error file=claudecode/config.yaml::options never read by any boot code: {sorted(unread)}")
              print(f"searched: {sources}")
              sys.exit(1)
          print(f"ok: all {len(opts)} options are read by the boot script or a helper")
          PY

      - name: options and schema keys are in sync
        run: |
          python3 - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("claudecode/config.yaml"))
          missing = [k for k in ("options", "schema") if k not in cfg]
          if missing:
              print(f"::error::config.yaml missing keys: {missing}")
              sys.exit(1)
          opts, schema = set(cfg["options"]), set(cfg["schema"])
          if opts != schema:
              if opts - schema:
                  print(f"::error::options without schema entry: {sorted(opts - schema)}")
              if schema - opts:
                  print(f"::error::schema entries without an options default: {sorted(schema - opts)}")
              sys.exit(1)
          print(f"ok: {len(opts)} options, schema in sync")
          PY

  boot-script-shell:
    name: Boot script syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Extract embedded boot script
        run: python3 .github/scripts/extract-boot-script.py > /tmp/boot.sh

      - name: bash -n (parse-only syntax check)
        run: bash -n /tmp/boot.sh

      - name: shellcheck (advisory)
        # Advisory: the extracted script is one long joined line so location
        # info is approximate, and several `$VAR` expansions are intentionally
        # word-split. Keep the check non-blocking until the boot logic is
        # promoted to a standalone boot.sh tracked in the repo.
        run: |
          shellcheck \
            -e SC2086 -e SC2155 -e SC2046 -e SC2016 -e SC1009 -e SC1073 -e SC1072 \
            /tmp/boot.sh || true

      - name: shellcheck privileged-action guard scripts (blocking)
        # These ship as standalone rootfs files (not the joined boot string), so
        # they get a real, blocking shellcheck.
        run: |
          shellcheck \
            claudecode/rootfs/usr/local/bin/ha-privileged-guard.sh \
            claudecode/rootfs/usr/local/bin/ha-guard-configure.sh

  build:
    name: Docker build smoke (amd64)
    runs-on: ubuntu-latest
    needs: [lint, boot-script-shell]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: claudecode
          file: claudecode/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hass-claude-test:amd64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.21
            BUILD_ARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expected tools are installed
        run: |
          docker run --rm hass-claude-test:amd64 sh -eu -c '
            command -v claude   >/dev/null && echo "claude:   $(claude --version 2>&1 | head -n1)"
            command -v jq       >/dev/null && echo "jq:       $(jq --version)"
            command -v ttyd     >/dev/null && echo "ttyd:     installed"
            command -v node     >/dev/null && echo "node:     $(node --version)"
            command -v npm      >/dev/null && echo "npm:      $(npm --version)"
            command -v hass-mcp >/dev/null && echo "hass-mcp: installed"
            command -v tmux     >/dev/null && echo "tmux:     $(tmux -V)"
            command -v docker   >/dev/null && echo "docker:   $(docker --version)"
            command -v rg       >/dev/null && echo "rg:       $(rg --version | head -n1)"
          '

      - name: Boot smoke runs the real script with ttyd stubbed out
        run: |
          set -euo pipefail
          mkdir -p smoke/data smoke/homeassistant
          cat > smoke/data/options.json <<'EOF'
          {
            "enable_mcp": true,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300
          }
          EOF
          # Pull the actual boot script out of the Dockerfile and replace the
          # tail `exec ttyd ...` with a marker echo so the script returns.
          python3 .github/scripts/extract-boot-script.py > smoke/boot-real.sh
          sed -E 's|exec ttyd .*$|echo "[smoke] boot reached ttyd launch (stubbed)"|' \
            smoke/boot-real.sh > smoke/boot-smoke.sh
          # /data is mounted rw to match Supervisor behaviour: the boot
          # script seeds /data/npm-global from /opt/npm-global on first
          # boot (issue #13) and auto_update_claude writes there too.
          # /homeassistant is mounted rw to emulate the persistent HA config
          # volume so the .claude.json symlink target is observable from the
          # host after the run (regression guard for #20).
          docker run --rm \
            -v "$PWD/smoke/data:/data:rw" \
            -v "$PWD/smoke/homeassistant:/homeassistant:rw" \
            -v "$PWD/smoke/boot-smoke.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot.log
          # Required boot-script log lines.
          grep -q '\[INFO\] MCP configured with Home Assistant integration' smoke/boot.log
          grep -q '\[INFO\] Pre-authorized read-only MCP tools'             smoke/boot.log
          grep -q '\[INFO\] auto_update_claude disabled - skipping update'  smoke/boot.log
          grep -q '\[INFO\] Seeding /data/npm-global from /opt/npm-global'  smoke/boot.log
          grep -q '\[smoke\] boot reached ttyd launch (stubbed)'            smoke/boot.log
          # Seeded layout must actually contain the claude binary symlink,
          # and the seed-complete marker must be written (issue #22).
          test -x smoke/data/npm-global/bin/claude
          test -f smoke/data/npm-global/.seed-complete
          grep -q '\[INFO\] Seeded /data/npm-global' smoke/boot.log
          # Regression guard for #33: the pre-authorized tool list must never
          # ship Glob()/Grep() permission rules again. Current Claude Code CLIs
          # reject them (Read(path) already covers Glob and Grep), which stops
          # the CLI launching and produces a reconnect loop.
          jq -e '[(.permissions.allow // [])[] | select(startswith("Glob(") or startswith("Grep("))] | length == 0' \
            smoke/homeassistant/.claudecode/settings.json >/dev/null \
            || { echo "::error::settings.json still ships Glob()/Grep() permission rules (issue #33)"; exit 1; }
          # The Read rules that actually grant the access must still be there.
          jq -e '((.permissions.allow // []) | index("Read(/homeassistant/**)")) != null
                 and ((.permissions.allow // []) | index("Read(/config/**)")) != null' \
            smoke/homeassistant/.claudecode/settings.json >/dev/null
          # Regression guard for #20: the MCP-registration step must land the
          # config on the PERSISTENT volume, written through the
          # /root/.claude.json symlink to its target. The old code did
          # `mv /tmp/claude.tmp "$CLAUDE_JSON"`, which rename(2)-replaced the
          # symlink with a plain file in the ephemeral layer, so the persistent
          # target stayed an empty `{}` and login state never survived a
          # restart. If that regresses, the file below has no mcpServers and the
          # jq assertion fails.
          test -f smoke/homeassistant/.claudecode/.claude.json
          jq -e '.mcpServers.homeassistant.command == "hass-mcp"' \
            smoke/homeassistant/.claudecode/.claude.json >/dev/null
          # Privileged-action guard (issue #29): with no guard keys in the
          # options.json fixture the boot must fall back to the secure defaults,
          # write the policy file the hook reads, and wire the PreToolUse hook +
          # the fixed deny floor into settings.json.
          grep -q '\[INFO\] Privileged-action guard active' smoke/boot.log
          test -f smoke/homeassistant/.claudecode/ha-guard.json
          jq -e '.enabled == true
                 and ((.deny // []) | index("homeassistant.stop")) != null
                 and ((.confirm // []) | index("homeassistant.restart")) != null' \
            smoke/homeassistant/.claudecode/ha-guard.json >/dev/null
          jq -e '([.hooks.PreToolUse[]?.hooks[]?.command] | index("/usr/local/bin/ha-privileged-guard.sh")) != null' \
            smoke/homeassistant/.claudecode/settings.json >/dev/null
          jq -e '((.permissions.deny // []) | index("Bash(ha host reboot:*)")) != null' \
            smoke/homeassistant/.claudecode/settings.json >/dev/null
          # Regression guard for #15/#16: the web terminal opens a login shell,
          # and /etc/profile on the Alpine base resets PATH. `claude` must still
          # resolve on PATH in a real login shell, not just exist on disk.
          docker run --rm \
            -v "$PWD/smoke/data:/data:rw" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            -lc 'command -v claude' | grep -q '/npm-global/bin/claude'

      - name: Boot repairs a broken/partial /data/npm-global seed (regression guard for #22)
        run: |
          set -euo pipefail
          mkdir -p smoke/data-broken/npm-global/bin
          cat > smoke/data-broken/options.json <<'EOF'
          {
            "enable_mcp": true,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300
          }
          EOF
          # Simulate the partial tree a failed first-boot seed leaves on a
          # Protection-mode-on host: an executable but non-working bin/claude
          # launcher and NO .seed-complete marker. The old `[ ! -x bin/claude ]`
          # guard latched this state forever and it shadowed /opt on PATH; the
          # marker-gated self-healing seed must detect it and re-seed a good tree.
          printf '#!/bin/sh\nexit 1\n' > smoke/data-broken/npm-global/bin/claude
          chmod +x smoke/data-broken/npm-global/bin/claude
          # Reuse the stubbed boot script generated by the step above.
          docker run --rm \
            -v "$PWD/smoke/data-broken:/data:rw" \
            -v "$PWD/smoke/homeassistant:/homeassistant:rw" \
            -v "$PWD/smoke/boot-smoke.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-broken.log
          # The boot must have repaired the tree and marked it complete.
          grep -q '\[INFO\] Seeded /data/npm-global' smoke/boot-broken.log
          test -f smoke/data-broken/npm-global/.seed-complete
          # The repaired launcher must be the real one and actually run.
          docker run --rm \
            -v "$PWD/smoke/data-broken:/data:rw" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            -lc 'claude --version' >/dev/null

      - name: Boot builds the right launch command for auto_continue (issue #24)
        run: |
          set -euo pipefail
          # Pull the real boot script and stub the `exec ttyd ...` launch with a
          # printf that emits each element of the SHELL_CMD array on its own line,
          # so we can assert the constructed argv. The whole risk of the
          # auto_continue change is quoting: `bash -ic cc` must reach tmux as ONE
          # argument, not word-split into `bash`, `-ic`, `cc`.
          python3 .github/scripts/extract-boot-script.py > smoke/boot-real.sh
          sed -E 's|exec ttyd .*$|printf "ARG:%s\\n" "${SHELL_CMD[@]}"|' \
            smoke/boot-real.sh > smoke/boot-shellcmd.sh

          # session_persistence + auto_continue ON: tmux launches `bash -ic cc`
          # as a single argument.
          mkdir -p smoke/data-autocontinue
          cat > smoke/data-autocontinue/options.json <<'EOF'
          {
            "enable_mcp": false,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": true,
            "auto_continue": true,
            "auto_update_claude": false,
            "claude_update_timeout": 300
          }
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-autocontinue:/data:rw" \
            -v "$PWD/smoke/boot-shellcmd.sh:/usr/local/bin/boot-shellcmd.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-shellcmd.sh 2>&1 | tee smoke/boot-autocontinue.log
          grep -qx 'ARG:tmux'        smoke/boot-autocontinue.log
          grep -qx 'ARG:new-session' smoke/boot-autocontinue.log
          grep -qx 'ARG:claude'      smoke/boot-autocontinue.log
          grep -qx 'ARG:bash -ic cc' smoke/boot-autocontinue.log
          # The sub-command must NOT have word-split into separate args.
          if grep -qx 'ARG:bash' smoke/boot-autocontinue.log; then
            echo "::error::auto_continue launch word-split: 'bash -ic cc' did not survive as one argument"
            exit 1
          fi
          # This fixture sets enable_mcp:false, so the boot must actually disable
          # MCP. Regression guard: `jq -r '.enable_mcp // true'` treated a literal
          # false as absent and returned true, leaving MCP on when it was off.
          grep -q '\[INFO\] MCP disabled' smoke/boot-autocontinue.log
          if grep -q '\[INFO\] MCP configured' smoke/boot-autocontinue.log; then
            echo "::error::enable_mcp is false but MCP was still configured"
            exit 1
          fi

          # session_persistence ON, auto_continue OFF: plain tmux session, no cc.
          mkdir -p smoke/data-noautocontinue
          cat > smoke/data-noautocontinue/options.json <<'EOF'
          {
            "enable_mcp": false,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": true,
            "auto_continue": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300
          }
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-noautocontinue:/data:rw" \
            -v "$PWD/smoke/boot-shellcmd.sh:/usr/local/bin/boot-shellcmd.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-shellcmd.sh 2>&1 | tee smoke/boot-noautocontinue.log
          grep -qx 'ARG:tmux'   smoke/boot-noautocontinue.log
          grep -qx 'ARG:claude' smoke/boot-noautocontinue.log
          if grep -q 'ARG:bash -ic cc' smoke/boot-noautocontinue.log; then
            echo "::error::auto_continue is off but the cc launch command is present"
            exit 1
          fi

      - name: Boot honors unattended_mode (issue #39)
        run: |
          set -euo pipefail
          # Dedicated stub: replace the tail `exec ttyd ...` with a probe that
          # prints whether IS_SANDBOX is actually EXPORTED at the exec point.
          # `env` lists only exported variables, so this catches a refactor
          # that loses the export (plain assignment, a subshell); the
          # "[INFO] ... exported" log grep cannot, because that line is
          # printed by the same branch that does the export. The braces keep
          # an earlier boot failure fatal instead of masked by the fallback.
          python3 .github/scripts/extract-boot-script.py > smoke/boot-real-unattended.sh
          sed -E 's#exec ttyd .*$#{ env | grep "^IS_SANDBOX=" || echo "IS_SANDBOX=unset"; }#' \
            smoke/boot-real-unattended.sh > smoke/boot-sandboxprobe.sh

          # Case 1: unattended_mode: true must export IS_SANDBOX and
          # HA_GUARD_UNATTENDED, set permissions.defaultMode, and stamp
          # unattended:true into ha-guard.json, all WITHOUT destroying settings
          # already in the file. Seed some first: this fixture has
          # enable_mcp:false, so nothing else populates settings.json and an
          # empty {} input could not tell "merged" from "replaced wholesale".
          mkdir -p smoke/data-unattended smoke/ha-unattended/.claudecode
          cat > smoke/data-unattended/options.json <<'EOF'
          {
            "enable_mcp": false,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300,
            "unattended_mode": true
          }
          EOF
          cat > smoke/ha-unattended/.claudecode/settings.json <<'EOF'
          {"model":"opus","permissions":{"deny":["Bash(rm -rf /:*)"],"allow":["Read(/homeassistant/**)"]}}
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-unattended:/data:rw" \
            -v "$PWD/smoke/ha-unattended:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-unattended-on.log
          grep -q '\[INFO\] Unattended mode: IS_SANDBOX=1 exported for this session' smoke/boot-unattended-on.log
          grep -q '\[INFO\] Unattended mode: HA_GUARD_UNATTENDED=1 exported for the privileged-action guard' smoke/boot-unattended-on.log
          grep -q '\[INFO\] Unattended mode: permissions.defaultMode set to bypassPermissions' smoke/boot-unattended-on.log
          # Probe line: the variable is really in the exported environment at
          # the point ttyd would exec, not merely logged earlier.
          grep -qx 'IS_SANDBOX=1' smoke/boot-unattended-on.log
          S=smoke/ha-unattended/.claudecode/settings.json
          jq -e '.permissions.defaultMode == "bypassPermissions"' "$S" >/dev/null \
            || { echo "::error::unattended_mode:true did not set permissions.defaultMode"; exit 1; }
          # The set branch (and the guard configurator that now runs BEFORE it)
          # must preserve everything that was already in settings.json.
          jq -e '.model == "opus"' "$S" >/dev/null \
            || { echo "::error::unattended set branch clobbered unrelated top-level settings"; exit 1; }
          jq -e '((.permissions.deny // []) | index("Bash(rm -rf /:*)")) != null' "$S" >/dev/null \
            || { echo "::error::unattended set branch dropped a user permissions.deny rule"; exit 1; }
          jq -e '((.permissions.allow // []) | index("Read(/homeassistant/**)")) != null' "$S" >/dev/null \
            || { echo "::error::unattended set branch dropped a user permissions.allow rule"; exit 1; }
          jq -e '.unattended == true' smoke/ha-unattended/.claudecode/ha-guard.json >/dev/null \
            || { echo "::error::unattended:true was not stamped into ha-guard.json"; exit 1; }

          # Case 2: unattended_mode: false (or absent) must PRUNE a
          # permissions.defaultMode: bypassPermissions left by an earlier boot
          # (or hand-edited, the exact #39 report) rather than leaving it in
          # place -- the same "shipped settings only ever merge in additively"
          # trap as the Glob/Grep prune (#33) and the stray mcpServers prune
          # (#20/#22 era). A stale key here is exactly what makes the CLI
          # refuse to launch as root once IS_SANDBOX is no longer set.
          mkdir -p smoke/data-unattended-off smoke/ha-unattended-off/.claudecode
          cat > smoke/data-unattended-off/options.json <<'EOF'
          {
            "enable_mcp": false,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300,
            "unattended_mode": false
          }
          EOF
          cat > smoke/ha-unattended-off/.claudecode/settings.json <<'EOF'
          {"permissions":{"defaultMode":"bypassPermissions","allow":["Read(/homeassistant/**)"]}}
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-unattended-off:/data:rw" \
            -v "$PWD/smoke/ha-unattended-off:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-unattended-off.log
          grep -q '\[INFO\] Unattended mode off: removed a stale permissions.defaultMode: bypassPermissions' \
            smoke/boot-unattended-off.log
          # IS_SANDBOX must NOT be exported when the option is off.
          grep -qx 'IS_SANDBOX=unset' smoke/boot-unattended-off.log
          jq -e '(.permissions | has("defaultMode")) | not' \
            smoke/ha-unattended-off/.claudecode/settings.json >/dev/null \
            || { echo "::error::stale permissions.defaultMode was not pruned when unattended_mode is off"; exit 1; }
          # The prune must not touch unrelated permission rules.
          jq -e '(.permissions.allow // []) | index("Read(/homeassistant/**)") != null' \
            smoke/ha-unattended-off/.claudecode/settings.json >/dev/null \
            || { echo "::error::unattended_mode prune removed unrelated settings"; exit 1; }
          jq -e '.unattended == false' smoke/ha-unattended-off/.claudecode/ha-guard.json >/dev/null \
            || { echo "::error::ha-guard.json should carry unattended:false when the option is off"; exit 1; }

          # Case 3: a hand-set defaultMode survives an on/off round trip. On
          # replaces acceptEdits with bypassPermissions, warns, and remembers
          # the old value in a sidecar; off restores it and deletes the sidecar.
          mkdir -p smoke/data-roundtrip smoke/ha-roundtrip/.claudecode
          sed 's/"unattended_mode": false/"unattended_mode": true/' \
            smoke/data-unattended-off/options.json > smoke/data-roundtrip/options.json
          cat > smoke/ha-roundtrip/.claudecode/settings.json <<'EOF'
          {"permissions":{"defaultMode":"acceptEdits"}}
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-roundtrip:/data:rw" \
            -v "$PWD/smoke/ha-roundtrip:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-roundtrip-on.log
          grep -q '\[WARN\] Unattended mode replaced your permissions.defaultMode: acceptEdits' \
            smoke/boot-roundtrip-on.log
          jq -e '.permissions.defaultMode == "bypassPermissions"' \
            smoke/ha-roundtrip/.claudecode/settings.json >/dev/null \
            || { echo "::error::round trip: on did not set bypassPermissions over acceptEdits"; exit 1; }
          [ "$(cat smoke/ha-roundtrip/.claudecode/.defaultmode-before-unattended)" = "acceptEdits" ] \
            || { echo "::error::round trip: sidecar does not hold the displaced defaultMode"; exit 1; }
          sed 's/"unattended_mode": true/"unattended_mode": false/' \
            smoke/data-roundtrip/options.json > smoke/data-roundtrip/options.json.new
          mv smoke/data-roundtrip/options.json.new smoke/data-roundtrip/options.json
          docker run --rm \
            -v "$PWD/smoke/data-roundtrip:/data:rw" \
            -v "$PWD/smoke/ha-roundtrip:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-roundtrip-off.log
          grep -q '\[INFO\] Unattended mode off: restored your previous permissions.defaultMode: acceptEdits' \
            smoke/boot-roundtrip-off.log
          jq -e '.permissions.defaultMode == "acceptEdits"' \
            smoke/ha-roundtrip/.claudecode/settings.json >/dev/null \
            || { echo "::error::round trip: off did not restore the displaced defaultMode"; exit 1; }
          if [ -e smoke/ha-roundtrip/.claudecode/.defaultmode-before-unattended ]; then
            echo "::error::round trip: sidecar was not removed after the restore"; exit 1
          fi

          # Case 4: a malformed settings.json no longer costs the whole boot
          # its defaultMode (the old ordering wrote defaultMode BEFORE the only
          # repair path ran, so IS_SANDBOX was exported without the mode for a
          # full session). The early repair backs the file up, resets it, and
          # the unattended write then succeeds in the same boot.
          mkdir -p smoke/data-corrupt-unatt smoke/ha-corrupt-unatt/.claudecode
          cp smoke/data-unattended/options.json smoke/data-corrupt-unatt/options.json
          printf '%s' '{"permissions":{"allow":["Read(/x)"],}}' \
            > smoke/ha-corrupt-unatt/.claudecode/settings.json
          docker run --rm \
            -v "$PWD/smoke/data-corrupt-unatt:/data:rw" \
            -v "$PWD/smoke/ha-corrupt-unatt:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-corrupt-unatt.log
          grep -q 'was not valid JSON' smoke/boot-corrupt-unatt.log
          jq -e '.permissions.defaultMode == "bypassPermissions"' \
            smoke/ha-corrupt-unatt/.claudecode/settings.json >/dev/null \
            || { echo "::error::corrupt settings: defaultMode missing after the early repair"; exit 1; }
          ls smoke/ha-corrupt-unatt/.claudecode/settings.json.corrupt.* >/dev/null 2>&1 \
            || { echo "::error::corrupt settings.json was not backed up by the early repair"; exit 1; }

          # Case 5: unattended_mode together with guard_privileged_actions
          # off removes both layers at once; the boot must say so loudly.
          mkdir -p smoke/data-unatt-noguard smoke/ha-unatt-noguard
          sed 's/"unattended_mode": true/"unattended_mode": true, "guard_privileged_actions": false/' \
            smoke/data-unattended/options.json > smoke/data-unatt-noguard/options.json
          docker run --rm \
            -v "$PWD/smoke/data-unatt-noguard:/data:rw" \
            -v "$PWD/smoke/ha-unatt-noguard:/homeassistant:rw" \
            -v "$PWD/smoke/boot-sandboxprobe.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-unatt-noguard.log
          grep -q '\[WARN\] unattended_mode is on while guard_privileged_actions is off' \
            smoke/boot-unatt-noguard.log

      - name: Claude CLI honors IS_SANDBOX under root (issue #39)
        run: |
          set -euo pipefail
          mkdir -p smoke
          # The whole point of unattended_mode is that IS_SANDBOX=1 makes the
          # CLI accept bypassPermissions under UID 0. auto_update_claude moves
          # the CLI under users, so drift here lands on real installs first
          # unless CI actually launches the CLI. No credentials exist in CI,
          # so the assertion is only about the ROOT refusal, which fires (or
          # not) at startup before any API traffic. Control first: without
          # IS_SANDBOX the refusal must appear; if it does not, the CLI has
          # changed shape and the step warns instead of asserting blind.
          docker run --rm --entrypoint /bin/bash hass-claude-test:amd64 \
            -lc 'claude --version' | tee smoke/cli-version.txt
          set +e
          CONTROL="$(docker run --rm --entrypoint /bin/bash hass-claude-test:amd64 -lc \
            'unset IS_SANDBOX; timeout 60 claude --dangerously-skip-permissions -p "exit" </dev/null 2>&1')"
          WITH_SANDBOX="$(docker run --rm --entrypoint /bin/bash hass-claude-test:amd64 -lc \
            'export IS_SANDBOX=1; timeout 60 claude --dangerously-skip-permissions -p "exit" </dev/null 2>&1')"
          set -e
          echo "--- control (no IS_SANDBOX), first lines: ---"
          printf '%s\n' "$CONTROL" | head -5
          echo "--- with IS_SANDBOX=1, first lines: ---"
          printf '%s\n' "$WITH_SANDBOX" | head -5
          REFUSAL='cannot be used with root'
          if ! printf '%s' "$CONTROL" | grep -qi "$REFUSAL"; then
            echo "::warning::root-refusal control did not fire; the CLI has changed shape and the IS_SANDBOX assertion was skipped"
          elif printf '%s' "$WITH_SANDBOX" | grep -qi "$REFUSAL"; then
            echo "::error::IS_SANDBOX=1 no longer suppresses the root refusal; unattended_mode is broken on this CLI ($(cat smoke/cli-version.txt))"
            exit 1
          else
            echo "PASS IS_SANDBOX=1 suppresses the root refusal ($(cat smoke/cli-version.txt))"
          fi

      - name: Boot repairs an install already broken by Glob/Grep rules (issue #33)
        run: |
          set -euo pipefail
          # An install that already ran an affected release has the four rules
          # baked into the PERSISTENT settings.json. Dropping them from the
          # shipped list is not enough on its own, because the pre-authorization
          # merge only ever adds. The boot must actively prune them, and must do
          # so even with enable_mcp:false, which never reaches that merge.
          mkdir -p smoke/data-glob smoke/ha-glob/.claudecode
          cat > smoke/data-glob/options.json <<'EOF'
          {
            "enable_mcp": false,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": false,
            "claude_update_timeout": 300
          }
          EOF
          cat > smoke/ha-glob/.claudecode/settings.json <<'EOF'
          {"permissions":{"allow":[
            "Read(/homeassistant/**)","Read(/config/**)",
            "Glob(/homeassistant/**)","Glob(/config/**)",
            "Grep(/homeassistant/**)","Grep(/config/**)",
            "Glob(/my/own/**)"
          ]}}
          EOF
          docker run --rm \
            -v "$PWD/smoke/data-glob:/data:rw" \
            -v "$PWD/smoke/ha-glob:/homeassistant:rw" \
            -v "$PWD/smoke/boot-smoke.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-glob.log
          grep -q '\[INFO\] MCP disabled' smoke/boot-glob.log
          grep -q '\[INFO\] Removed deprecated permission rules' smoke/boot-glob.log
          S=smoke/ha-glob/.claudecode/settings.json
          jq -e '[(.permissions.allow // [])[] | select(startswith("Glob(") or startswith("Grep("))] | length == 0' "$S" >/dev/null \
            || { echo "::error::stale Glob()/Grep() rules were not pruned from an existing settings.json (issue #33)"; exit 1; }
          jq -e '((.permissions.allow // []) | index("Read(/homeassistant/**)")) != null
                 and ((.permissions.allow // []) | index("Read(/config/**)")) != null' "$S" >/dev/null \
            || { echo "::error::pruning removed the Read rules it was supposed to keep"; exit 1; }

      - name: Boot smoke covers the failure-tail path on a forced timeout
        run: |
          set -euo pipefail
          mkdir -p smoke/data-update
          # auto_update_claude=true with a 1s timeout forces the failure path
          # so we can exercise the new tail-on-failure / append-log code.
          cat > smoke/data-update/options.json <<'EOF'
          {
            "enable_mcp": true,
            "terminal_font_size": 14,
            "terminal_theme": "dark",
            "working_directory": "/homeassistant",
            "session_persistence": false,
            "auto_update_claude": true,
            "claude_update_timeout": 1
          }
          EOF
          python3 .github/scripts/extract-boot-script.py > smoke/boot-real.sh
          sed -E 's|exec ttyd .*$|wait; echo "[smoke] boot reached ttyd (stubbed); waited for background update"|' \
            smoke/boot-real.sh > smoke/boot-smoke-update.sh
          # /data mounted rw: auto_update_claude now writes to
          # /data/npm-global via NPM_CONFIG_PREFIX (issue #13).
          docker run --rm \
            -v "$PWD/smoke/data-update:/data:rw" \
            -v "$PWD/smoke/boot-smoke-update.sh:/usr/local/bin/boot-smoke.sh:ro" \
            --entrypoint /bin/bash \
            hass-claude-test:amd64 \
            /usr/local/bin/boot-smoke.sh 2>&1 | tee smoke/boot-update.log
          grep -q '\[INFO\] Updating Claude Code in background (timeout 1s)' smoke/boot-update.log
          grep -q '\[WARN\] Claude Code update failed/timed out'             smoke/boot-update.log
          # Tail-on-failure must produce at least one indented line.
          grep -qE '^  \| '                                                  smoke/boot-update.log

      - name: Privileged-action guard hook decisions (issue #29)
        run: |
          set -euo pipefail
          # Drive the REAL hook inside the built image with crafted PreToolUse
          # payloads and a fixed policy, asserting the decision for each vector:
          # MCP call_service_tool, the restart_ha tool, and shell commands.
          mkdir -p smoke/guard
          printf '%s' '{"enabled":true,"deny":["homeassistant.stop","supervisor.core_stop","supervisor.watchdog_disable","hassio.host_reboot","hassio.host_shutdown","hassio.os_update"],"confirm":["homeassistant.restart","hassio.supervisor_restart"]}' > smoke/guard/ha-guard.json
          run_hook() {
            printf '%s' "$1" | docker run --rm -i \
              -e HA_GUARD_CONFIG=/guard/ha-guard.json \
              -v "$PWD/smoke/guard:/guard:ro" \
              --entrypoint /usr/local/bin/ha-privileged-guard.sh \
              hass-claude-test:amd64
          }
          expect() { # $1 desc  $2 payload  $3 expected decision (deny|ask|allow)
            local out got
            out="$(run_hook "$2")"
            if [ -z "$out" ]; then got=allow; else got="$(printf '%s' "$out" | jq -r '.hookSpecificOutput.permissionDecision')"; fi
            if [ "$got" = "$3" ]; then
              echo "PASS [$3] $1"
            else
              echo "::error::guard hook '$1': expected $3 got '$got' (raw: $out)"
              exit 1
            fi
          }
          expect "call_service homeassistant.stop"    '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}'    deny
          expect "call_service hassio.host_reboot"    '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"hassio","service":"host_reboot"}}'     deny
          expect "call_service homeassistant.restart" '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' ask
          expect "call_service light.turn_on (safe)"  '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"light","service":"turn_on"}}'         allow
          expect "restart_ha tool"                    '{"tool_name":"mcp__homeassistant__restart_ha","tool_input":{}}'                                                     ask
          expect "bash ha host reboot"                '{"tool_name":"Bash","tool_input":{"command":"ha host reboot"}}'                                                     deny
          expect "bash watchdog disable curl"         '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/homeassistant/options -d {\"watchdog\": false}"}}' deny
          expect "bash ha core logs (safe)"           '{"tool_name":"Bash","tool_input":{"command":"ha core logs | tail -100"}}'                                          allow
          # REST service-path vector: stop/reboot via the Core REST API must be
          # matched, not just the ha CLI (regression guard, review finding).
          expect "REST stop via /api/services"        '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/core/api/services/homeassistant/stop"}}' deny
          expect "REST hassio.host_reboot"            '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/core/api/services/hassio/host_reboot"}}' deny
          expect "REST light.turn_on (safe)"          '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/core/api/services/light/turn_on"}}'   allow
          # Line-continuation must not slip the command past the matcher.
          expect "bash ha core (cont) stop"           '{"tool_name":"Bash","tool_input":{"command":"ha core \\\n  stop"}}'                                                 deny
          # Bare mention in a read command must NOT be blocked (false-positive guard).
          expect "bash grep mentions stop (safe)"     '{"tool_name":"Bash","tool_input":{"command":"ha core logs | grep -i homeassistant.stop"}}'                        allow
          # Host-agnostic Supervisor addressing + the /homeassistant/* alias family
          # (the exact endpoint the issue #29 incident used). Matching only the
          # supervisor hostname and only /core/* left all of these open.
          expect "homeassistant/* alias stop"         '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/homeassistant/stop"}}'                 deny
          expect "raw-IP core stop"                   '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://172.30.32.2/core/stop"}}'                         deny
          expect "var-addressed homeassistant stop"   '{"tool_name":"Bash","tool_input":{"command":"curl -X POST \"$SUPERVISOR_API/homeassistant/stop\""}}'               deny
          expect "homeassistant/restart alias (ask)"  '{"tool_name":"Bash","tool_input":{"command":"curl -X POST http://supervisor/homeassistant/restart"}}'              ask
          # ha CLI cobra aliases + a leading global flag must not bypass the hook.
          expect "ha ha stop alias"                   '{"tool_name":"Bash","tool_input":{"command":"ha ha stop"}}'                                                         deny
          expect "ha homeassistant stop alias"        '{"tool_name":"Bash","tool_input":{"command":"ha homeassistant stop"}}'                                              deny
          expect "ha ho reboot alias"                 '{"tool_name":"Bash","tool_input":{"command":"ha ho reboot"}}'                                                       deny
          expect "ha su restart alias (ask)"          '{"tool_name":"Bash","tool_input":{"command":"ha su restart"}}'                                                      ask
          expect "ha hassos update alias"             '{"tool_name":"Bash","tool_input":{"command":"ha hassos update"}}'                                                   deny
          expect "ha --flag core stop"                '{"tool_name":"Bash","tool_input":{"command":"ha --no-progress core stop"}}'                                         deny
          # bashio helper vector (the base image ships bashio).
          expect "bashio core.stop"                   '{"tool_name":"Bash","tool_input":{"command":"bashio::core.stop"}}'                                                  deny
          # False-positive guards: a denied verb quoted as DATA (echo/grep/cat of a
          # config path, a watchdog value in a log grep) must stay allowed, or users
          # will disable the guard. The `ha` verb is only matched at a command
          # position, and the watchdog value form only with an HTTP client present.
          expect "echo mentions restart (safe)"       '{"tool_name":"Bash","tool_input":{"command":"echo \"reminder: run ha core restart later\""}}'                      allow
          expect "cat homeassistant path (safe)"      '{"tool_name":"Bash","tool_input":{"command":"cat /homeassistant/restart.yaml"}}'                                    allow
          expect "grep watchdog=false log (safe)"     '{"tool_name":"Bash","tool_input":{"command":"grep -c watchdog=false /homeassistant/home-assistant.log"}}'          allow
          # A well-formed policy file with a wrong-typed .deny must fall back to the
          # hard-coded baseline (fail closed), not collapse the list to empty.
          printf '%s' '{"enabled":true,"deny":"homeassistant.stop","confirm":[]}' > smoke/guard/ha-guard.json
          expect "wrong-typed deny fails closed"      '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}'    deny
          printf '%s' '{"enabled":true,"deny":["homeassistant.stop","supervisor.core_stop","supervisor.watchdog_disable","hassio.host_reboot","hassio.host_shutdown","hassio.os_update"],"confirm":["homeassistant.restart","hassio.supervisor_restart"]}' > smoke/guard/ha-guard.json
          # With the guard disabled, a denied action must pass through.
          printf '%s' '{"enabled":false,"deny":["homeassistant.stop"],"confirm":[]}' > smoke/guard/ha-guard.json
          expect "disabled guard allows stop"         '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}'    allow
          # Baseline must survive a missing/corrupt policy file (fails closed to
          # the hard-coded baseline, not open).
          missing="$(printf '%s' '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}' \
            | docker run --rm -i -e HA_GUARD_CONFIG=/guard/does-not-exist.json -v "$PWD/smoke/guard:/guard:ro" \
                --entrypoint /usr/local/bin/ha-privileged-guard.sh hass-claude-test:amd64)"
          if printf '%s' "$missing" | jq -e '.hookSpecificOutput.permissionDecision == "deny"' >/dev/null; then
            echo "PASS [deny] baseline enforced with missing policy file"
          else
            echo "::error::baseline not enforced when policy file is missing (got: $missing)"
            exit 1
          fi
          # The deny REASON is what Claude reads and acts on, so its wording is
          # behaviour, not decoration. On a live install the old wording ("ask
          # the user to perform it themselves") led Claude to refuse correctly
          # and then volunteer a ready-to-paste `!`-prefixed shell command to do
          # it anyway. Assert the message points at a human path and carries the
          # explicit no-bypass-recipe instruction, so that cannot regress.
          printf '%s' '{"enabled":true,"deny":["homeassistant.stop"],"confirm":[]}' > smoke/guard/ha-guard.json
          why="$(run_hook '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}' \
            | jq -r '.hookSpecificOutput.permissionDecisionReason')"
          for phrase in "Home Assistant UI" "guard_privileged_actions" "do NOT hand the user"; do
            case "$why" in
              *"$phrase"*) echo "PASS deny reason contains: $phrase" ;;
              *) echo "::error::deny reason is missing '$phrase' (got: $why)"; exit 1 ;;
            esac
          done
          # --- Unattended promotion (issue #39 follow-up): while unattended,
          # confirm-tier asks are promoted to deny (nobody can answer a
          # prompt), signalled by the HA_GUARD_UNATTENDED env var the boot
          # exports OR the unattended flag stamped into the policy file.
          printf '%s' '{"enabled":true,"deny":["homeassistant.stop","supervisor.core_stop","supervisor.watchdog_disable","hassio.host_reboot","hassio.host_shutdown","hassio.os_update"],"confirm":["homeassistant.restart","hassio.supervisor_restart"]}' > smoke/guard/ha-guard.json
          run_hook_u() {
            printf '%s' "$1" | docker run --rm -i \
              -e HA_GUARD_CONFIG=/guard/ha-guard.json \
              -e HA_GUARD_UNATTENDED=1 \
              -v "$PWD/smoke/guard:/guard:ro" \
              --entrypoint /usr/local/bin/ha-privileged-guard.sh \
              hass-claude-test:amd64
          }
          expect_u() { # $1 desc  $2 payload  $3 expected decision
            local out got
            out="$(run_hook_u "$2")"
            if [ -z "$out" ]; then got=allow; else got="$(printf '%s' "$out" | jq -r '.hookSpecificOutput.permissionDecision')"; fi
            if [ "$got" = "$3" ]; then
              echo "PASS [$3] (unattended) $1"
            else
              echo "::error::guard hook unattended '$1': expected $3 got '$got' (raw: $out)"
              exit 1
            fi
          }
          expect_u "restart promoted to deny"        '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' deny
          expect_u "restart_ha tool promoted"        '{"tool_name":"mcp__homeassistant__restart_ha","tool_input":{}}'                                                     deny
          expect_u "ha su restart promoted"          '{"tool_name":"Bash","tool_input":{"command":"ha su restart"}}'                                                      deny
          expect_u "stop still denied"               '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"stop"}}'    deny
          expect_u "light.turn_on still allowed"     '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"light","service":"turn_on"}}'         allow
          # The promoted reason must explain the unattended refusal and stay
          # free of bypass recipes, like every other deny reason.
          uwhy="$(run_hook_u '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' \
            | jq -r '.hookSpecificOutput.permissionDecisionReason')"
          for phrase in "unattended_mode" "do NOT hand the user"; do
            case "$uwhy" in
              *"$phrase"*) echo "PASS promoted reason contains: $phrase" ;;
              *) echo "::error::promoted reason is missing '$phrase' (got: $uwhy)"; exit 1 ;;
            esac
          done
          # Policy-file flag alone (a docker exec shell has no boot env).
          printf '%s' '{"enabled":true,"deny":[],"confirm":[],"unattended":true}' > smoke/guard/ha-guard.json
          expect "policy-flag unattended promotes"    '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' deny
          printf '%s' '{"enabled":true,"deny":[],"confirm":[],"unattended":false}' > smoke/guard/ha-guard.json
          expect "unattended:false still asks"        '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' ask
          # Env var alone with a MISSING policy file: the fail-closed baseline
          # must be promoted too (a file-borne flag cannot reach this path).
          pmissing="$(printf '%s' '{"tool_name":"mcp__homeassistant__call_service_tool","tool_input":{"domain":"homeassistant","service":"restart"}}' \
            | docker run --rm -i -e HA_GUARD_CONFIG=/guard/does-not-exist.json -e HA_GUARD_UNATTENDED=1 \
                -v "$PWD/smoke/guard:/guard:ro" \
                --entrypoint /usr/local/bin/ha-privileged-guard.sh hass-claude-test:amd64)"
          if printf '%s' "$pmissing" | jq -e '.hookSpecificOutput.permissionDecision == "deny"' >/dev/null; then
            echo "PASS [deny] promotion holds with missing policy file (env var path)"
          else
            echo "::error::promotion did not hold with a missing policy file (got: $pmissing)"
            exit 1
          fi
          # --- Guard-file tamper protection: Write/Edit onto the guard's own
          # policy file are denied on both path spellings; the settings file
          # (hook registration + deny floor) asks when attended and is refused
          # when unattended; ordinary files are untouched. Bash writes onto
          # the same files are caught in their obvious forms, reads are not.
          printf '%s' '{"enabled":true,"deny":["homeassistant.stop","supervisor.core_stop","supervisor.watchdog_disable","hassio.host_reboot","hassio.host_shutdown","hassio.os_update"],"confirm":["homeassistant.restart","hassio.supervisor_restart"]}' > smoke/guard/ha-guard.json
          expect "Write guard policy file"            '{"tool_name":"Write","tool_input":{"file_path":"/root/.claude/ha-guard.json","content":"{}"}}'                     deny
          expect "Write policy via persist path"      '{"tool_name":"Write","tool_input":{"file_path":"/homeassistant/.claudecode/ha-guard.json","content":"{}"}}'        deny
          expect "Edit settings.json (attended)"      '{"tool_name":"Edit","tool_input":{"file_path":"/root/.claude/settings.json","old_string":"a","new_string":"b"}}'   ask
          expect_u "Edit settings.json (unattended)"  '{"tool_name":"Edit","tool_input":{"file_path":"/root/.claude/settings.json","old_string":"a","new_string":"b"}}'   deny
          expect "Write configuration.yaml (safe)"    '{"tool_name":"Write","tool_input":{"file_path":"/homeassistant/configuration.yaml","content":"x"}}'                allow
          expect "Write CLAUDE.md (safe)"             '{"tool_name":"Write","tool_input":{"file_path":"/root/.claude/CLAUDE.md","content":"x"}}'                          allow
          expect "bash redirect onto policy file"     '{"tool_name":"Bash","tool_input":{"command":"jq \".enabled=false\" /root/.claude/ha-guard.json > /root/.claude/ha-guard.json"}}' deny
          expect "bash tee onto persist policy"       '{"tool_name":"Bash","tool_input":{"command":"echo {} | tee /homeassistant/.claudecode/ha-guard.json"}}'            deny
          expect "bash cp onto settings (attended)"   '{"tool_name":"Bash","tool_input":{"command":"cp /tmp/settings.json /root/.claude/settings.json"}}'                 ask
          expect "bash cat policy file (safe)"        '{"tool_name":"Bash","tool_input":{"command":"cat /root/.claude/ha-guard.json"}}'                                   allow
          expect "bash cp settings to backup (safe)"  '{"tool_name":"Bash","tool_input":{"command":"cp /root/.claude/settings.json /tmp/settings-backup.json"}}'          allow
          expect "bash grep settings (safe)"          '{"tool_name":"Bash","tool_input":{"command":"grep defaultMode /root/.claude/settings.json"}}'                      allow
          expect "bash redirect to sibling (safe)"    '{"tool_name":"Bash","tool_input":{"command":"jq . /root/.claude/settings.json > /root/.claude/settings.json.bak"}}' allow
          # The policy-file tamper reason must point at the app options, not
          # at any way to reach the file.
          twhy="$(run_hook '{"tool_name":"Write","tool_input":{"file_path":"/root/.claude/ha-guard.json","content":"{}"}}' \
            | jq -r '.hookSpecificOutput.permissionDecisionReason')"
          for phrase in "Configuration tab" "do NOT hand the user"; do
            case "$twhy" in
              *"$phrase"*) echo "PASS tamper reason contains: $phrase" ;;
              *) echo "::error::tamper reason is missing '$phrase' (got: $twhy)"; exit 1 ;;
            esac
          done

      - name: Privileged-action guard configurator (issue #29)
        run: |
          set -euo pipefail
          # Drive the real ha-guard-configure.sh inside the built image against a
          # settings file that already holds USER-owned deny rules and a USER hook,
          # asserting: enable wires our hook+floor and keeps the user's; disable
          # removes only ours and preserves the user's (regression guard: the old
          # `select($floor|index(.))` wiped the user's entire deny list); and a
          # corrupt settings.json is backed up + reset, not silently skipped.
          run_cfg() { # $1 options-json ; edits smoke/cfg/settings.json in place
            write_cfg options.json "$1"
            docker run --rm \
              -e HA_GUARD_OPTIONS=/cfg/options.json \
              -e HA_GUARD_CONFIG=/cfg/ha-guard.json \
              -v "$PWD/smoke/cfg:/cfg" \
              --entrypoint /usr/local/bin/ha-guard-configure.sh \
              hass-claude-test:amd64 /cfg/settings.json
          }
          # The configurator runs as root and its `mv` leaves the settings file
          # root-owned, so the non-root runner cannot truncate it afterwards.
          # Write every fixture through a container for the same reason.
          write_cfg() { # $1 basename  $2 content
            docker run --rm -e C="$2" -e F="$1" \
              -v "$PWD/smoke/cfg:/cfg" --entrypoint sh hass-claude-test:amd64 \
              -c 'printf "%s" "$C" > "/cfg/$F"'
          }
          S=smoke/cfg/settings.json
          H=/usr/local/bin/ha-privileged-guard.sh
          assert() { # $1 desc  $2 jq-filter-over-$S (must be true)
            if jq -e "$2" "$S" >/dev/null 2>&1; then echo "PASS $1"; else
              echo "::error::configurator '$1' failed; settings=$(cat "$S")"; exit 1; fi
          }
          rm -rf smoke/cfg; mkdir -p smoke/cfg
          write_cfg settings.json '{"permissions":{"deny":["Bash(rm -rf /:*)","Bash(curl evil.example:*)"]},"hooks":{"PreToolUse":[{"matcher":"Write","hooks":[{"type":"command","command":"/usr/local/bin/user-audit.sh"}]}]}}'
          run_cfg '{}'
          assert "enable wires guard hook"      '([.hooks.PreToolUse[]?.hooks[]?.command]|index("'"$H"'"))!=null'
          assert "enable adds deny floor"       '(.permissions.deny|index("Bash(ha core stop:*)"))!=null'
          assert "enable keeps user deny"       '(.permissions.deny|index("Bash(rm -rf /:*)"))!=null'
          assert "enable keeps user hook"       '[.hooks.PreToolUse[]?|select((.hooks[]?.command)=="/usr/local/bin/user-audit.sh")]|length==1'
          run_cfg '{}'   # idempotent: still exactly one guard entry
          assert "enable idempotent"            '[.hooks.PreToolUse[]?|select((.hooks[]?.command)=="'"$H"'")]|length==1'
          run_cfg '{"guard_privileged_actions": false}'
          assert "disable keeps user deny"      '(.permissions.deny|index("Bash(rm -rf /:*)"))!=null'
          assert "disable keeps 2nd user deny"  '(.permissions.deny|index("Bash(curl evil.example:*)"))!=null'
          assert "disable removes our floor"    '(.permissions.deny|index("Bash(ha core stop:*)"))==null'
          assert "disable removes our hook"     '[.hooks.PreToolUse[]?|select((.hooks[]?.command)=="'"$H"'")]|length==0'
          assert "disable keeps user hook"      '[.hooks.PreToolUse[]?|select((.hooks[]?.command)=="/usr/local/bin/user-audit.sh")]|length==1'
          # unattended_mode is stamped into the policy file so the hook can
          # promote confirm-tier asks to denies (issue #39 follow-up).
          run_cfg '{"unattended_mode": true}'
          jq -e '.unattended == true' smoke/cfg/ha-guard.json >/dev/null \
            || { echo "::error::unattended_mode:true was not stamped into ha-guard.json"; exit 1; }
          echo "PASS configurator stamps unattended:true"
          run_cfg '{}'
          jq -e '.unattended == false' smoke/cfg/ha-guard.json >/dev/null \
            || { echo "::error::ha-guard.json should carry unattended:false by default"; exit 1; }
          echo "PASS configurator stamps unattended:false by default"
          # Corrupt (non-empty, invalid JSON) settings.json -> backup + reset + install.
          rm -f smoke/cfg/settings.json.corrupt.*
          write_cfg settings.json '{"permissions":{"allow":["Read(/x)"],}}'
          run_cfg '{}'
          jq -e . "$S" >/dev/null 2>&1 || { echo "::error::corrupt settings not repaired"; exit 1; }
          assert "corrupt: guard installed after reset" '([.hooks.PreToolUse[]?.hooks[]?.command]|index("'"$H"'"))!=null'
          ls smoke/cfg/settings.json.corrupt.* >/dev/null 2>&1 \
            && echo "PASS corrupt: original backed up" \
            || { echo "::error::corrupt settings.json was not backed up"; exit 1; }
