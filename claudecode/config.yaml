name: Claude Code
description: Run Claude Code AI assistant inside Home Assistant to create automations, debug issues, and manage your smart home configuration
version: "1.2.84"
slug: claudecode
url: https://github.com/sproft/hass-claude
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:brain
panel_title: Claude Code
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
full_access: false
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw
  - backup:ro
options:
  enable_mcp: true
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: false
  auto_continue: false
  auto_update_claude: false
  claude_update_timeout: 300
  guard_privileged_actions: true
  disallow_actions:
    - homeassistant.stop
    - supervisor.core_stop
    - supervisor.watchdog_disable
    - hassio.host_reboot
    - hassio.host_shutdown
    - hassio.os_update
  confirm_actions:
    - homeassistant.restart
    - hassio.supervisor_restart
  unattended_mode: false
schema:
  enable_mcp: bool
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  auto_continue: bool
  auto_update_claude: bool
  claude_update_timeout: int(30,1800)
  guard_privileged_actions: bool
  disallow_actions:
    - str
  confirm_actions:
    - str
  unattended_mode: bool
environment:
  TERM: xterm-256color
  NODE_OPTIONS: "--max-old-space-size=512"
