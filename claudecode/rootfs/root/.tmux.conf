set -g history-limit 5000
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -g mouse on
set -g xterm-keys on
set -s set-clipboard on
# Bracketed paste: tmux >= 3.2 enables this by default; force it for older builds
set -g allow-passthrough on
# Unattended mode (issue #39): IS_SANDBOX must reach the shell tmux spawns, and
# tmux only forwards variables on its update-environment list into sessions.
# Without this, a session created against a pre-existing tmux server, or after
# a kill-server, silently loses the flag and Claude Code refuses to launch
# under bypassPermissions as root. HA_GUARD_UNATTENDED rides along for the
# privileged-action guard's confirm-tier promotion.
set -ga update-environment ' IS_SANDBOX HA_GUARD_UNATTENDED'
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
